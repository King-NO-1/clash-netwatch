<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Clash NetWatch - Wi-Fi aware proxy and TUN switch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.52" stop-color="#0b2239"/>
      <stop offset="1" stop-color="#0a6f95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7dd3fc" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#sky)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- decorative wifi signal on the right -->
  <g stroke="#67e8f9" fill="none">
    <circle cx="1012" cy="138" r="122" stroke-opacity="0.06" stroke-width="1.5"/>
    <circle cx="1012" cy="138" r="92" stroke-opacity="0.09" stroke-width="1.5"/>
    <circle cx="1012" cy="138" r="62" stroke-opacity="0.13" stroke-width="1.5"/>
    <path d="M948 172a88 88 0 0 1 128 0" stroke-opacity="0.50" stroke-width="7" stroke-linecap="round"/>
    <path d="M974 196a50 50 0 0 1 76 0" stroke-opacity="0.72" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1012" cy="218" r="9" fill="#67e8f9" stroke="none"/>
  </g>
  <line x1="86" y1="52" x2="420" y2="52" stroke="url(#rule)" stroke-width="2"/>

  <!-- badge pills -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" letter-spacing="1.4" fill="#bae6fd">
    <rect x="80" y="66" width="132" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="146" y="84" text-anchor="middle" dominant-baseline="middle">EVENT-DRIVEN</text>
    <rect x="222" y="66" width="152" height="28" rx="14" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="298" y="84" text-anchor="middle" dominant-baseline="middle">ZERO DEPENDENCIES</text>
  </g>

  <text x="80" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Clash NetWatch</text>
  <text x="80" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#7dd3fc">Wi-Fi aware proxy and TUN switch</text>
  <text x="80" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#94a3b8">Hotspot on: proxy on. Leave: proxy off. No admin required.</text>
</svg>
