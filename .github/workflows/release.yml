name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Vet and test
        shell: pwsh
        run: |
          go vet ./...
          go test ./...

      - name: Build
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev-' + $env:GITHUB_SHA.Substring(0,7) }
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$ver" -o dist/netwatch.exe .
          if (-not (Test-Path dist/netwatch.exe)) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item config.example.json, install-task.ps1, LICENSE, QUICKSTART.txt, INSTALL_WITH_AI.md dist/
          Compress-Archive -Path dist/* -DestinationPath dist/netwatch-windows-amd64.zip -Force
          $lines = foreach ($f in (Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' })) {
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-windows-amd64
          path: dist/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/netwatch.exe dist/netwatch-windows-amd64.zip dist/SHA256SUMS.txt `
            --title "Clash NetWatch $tag" `
            --generate-notes
